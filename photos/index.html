    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../images/icon.png">
    <style>
        /* Photo Portfolio Container */
        .photo-portfolio-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Generic skeleton shimmer */
        .skeleton {
            background-color: #e9ecef;
            position: relative;
        }
        .skeleton::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%);
            animation: skeleton-shimmer 1.1s infinite;
            z-index: 0; /* keep under overlays/text */
        }
        @keyframes skeleton-shimmer {
            100% { left: 100%; }
        }

        /* Photo Banner Styles */
        .photo-banners-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
            padding: 0 20px;
        }

        .photo-banner {
            position: relative;
            height: 200px;
            border-radius: 25px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .photo-banner:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        /* Zoom effect on background image only */
        .photo-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: inherit;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s ease;
            z-index: 0;
            /* Preserve rounded corners while scaling */
            border-radius: inherit;
        }
        
        .photo-banner:hover::before {
            transform: scale(1.1);
        }

        .photo-banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1;
            /* Clip overlay to parent's rounded corners */
            border-radius: inherit;
        }

        .photo-banner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 2;
            margin: 0;
            text-align: center;
            width: 90%;
        }

        /* Grid View Styles */
        .grid-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            margin-bottom: 10px;
        }

        .back-button {
            background-color: var(--color-main);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-family: var(--font-primary);
        }

        .back-button:hover {
            background-color: var(--color-accent);
            transform: translateX(-3px);
        }

        .back-button i {
            font-size: 1rem;
        }

        .grid-title {
            font-size: 2.5rem;
            color: var(--color-main);
            margin: 0;
        }

        .photo-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .photo-grid-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: box-shadow 0.3s ease;
        }

        .photo-grid-item:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .photo-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease, opacity 0.25s ease;
        }
        
        .photo-grid-item:hover img {
            transform: scale(1.1);
        }

        .photo-grid-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px 15px 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .photo-grid-item:hover .photo-grid-overlay {
            opacity: 1;
        }
        /* Hide overlays while skeletons are shown */
        .photo-grid-item.skeleton .photo-grid-overlay {
            opacity: 0 !important;
        }

        .photo-grid-description {
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .photo-grid-buttons {
            display: flex;
            gap: 8px;
        }

        .photo-action-btn {
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--color-main);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .photo-action-btn:hover {
            background-color: var(--color-accent);
            color: white;
            transform: scale(1.05);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .photo-banner {
                height: 150px;
            }

            .photo-banner-text {
                font-size: 1.8rem;
            }

            .grid-title {
                font-size: 1.8rem;
            }

            .photo-grid-container {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
                padding: 15px;
            }

            .back-button {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .photo-banner {
                height: 120px;
            }

            .photo-banner-text {
                font-size: 1.4rem;
            }

            .grid-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .photo-grid-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
